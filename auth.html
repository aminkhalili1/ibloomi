<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — iBloomi</title>
  <meta name="description" content="Sign in or create your iBloomi account to start designing your perfect bouquet." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="images/favicon.png" type="image/png" sizes="32x32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">

  <!-- Minimal nav — logo only -->
  <header class="auth-nav">
    <a href="index.html" class="nav-logo" aria-label="Back to iBloomi home">
      <img src="images/logo.png" alt="iBloomi" />
    </a>
  </header>

  <!-- Config loading overlay — shown while /api/config is fetched -->
  <div class="auth-config-loading" id="auth-config-loading" aria-live="polite">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#7DC51E" stroke-width="2.5"
         style="animation:auth-spin 0.8s linear infinite;">
      <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
    </svg>
  </div>

  <!-- Config error state — shown if /api/config fails -->
  <div class="auth-config-error" id="auth-config-error" style="display:none;">
    <div class="auth-card" style="text-align:center;max-width:400px;">
      <p style="color:#e0443a;font-weight:600;margin-bottom:8px;">Configuration error</p>
      <p style="color:#5a6480;font-size:0.88rem;">The application is not configured correctly. Please contact <a href="mailto:info@ibloomi.nl" style="color:#0D1B5E;">info@ibloomi.nl</a>.</p>
    </div>
  </div>

  <!-- Main auth card -->
  <main class="auth-main" id="auth-main" style="display:none;">
    <div class="auth-card">

      <!-- Header -->
      <div class="auth-card-header">
        <h1 class="auth-heading">Welcome to iBloomi</h1>
        <p class="auth-subheading">Sign in or create an account to start designing your bouquet.</p>
      </div>

      <!-- Google OAuth — primary action -->
      <button class="auth-google-btn" id="btn-google" type="button">
        <span class="auth-spinner" style="display:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               style="animation:auth-spin 0.8s linear infinite;">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </span>
        <span class="auth-btn-label">
          <!-- Google G logo -->
          <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.85l6.08-6.08C34.5 3.01 29.55 1 24 1 14.62 1 6.62 6.48 3.05 14.34l7.09 5.51C11.93 13.36 17.47 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.1 24.5c0-1.64-.15-3.22-.42-4.74H24v8.97h12.43c-.54 2.87-2.17 5.3-4.63 6.93l7.09 5.51C43.18 37.27 46.1 31.36 46.1 24.5z"/>
            <path fill="#FBBC05" d="M10.14 28.15A14.55 14.55 0 0 1 9.5 24c0-1.44.2-2.84.55-4.16l-7.09-5.51A22.93 22.93 0 0 0 1 24c0 3.7.88 7.2 2.43 10.27l6.71-6.12z"/>
            <path fill="#34A853" d="M24 47c5.55 0 10.2-1.84 13.6-4.99l-7.09-5.51c-1.84 1.23-4.18 1.95-6.51 1.95-6.53 0-12.07-3.86-13.86-9.3l-6.71 6.12C6.62 41.52 14.62 47 24 47z"/>
          </svg>
          Continue with Google
        </span>
      </button>
      <p class="auth-error" id="error-google" style="display:none;"></p>

      <!-- Divider -->
      <div class="auth-divider">
        <span>or continue with email</span>
      </div>

      <!-- Tab switcher -->
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" data-tab="signin" role="tab" aria-selected="true"  type="button">Sign In</button>
        <button class="auth-tab"        data-tab="signup" role="tab" aria-selected="false" type="button">Create Account</button>
      </div>

      <!-- Sign In panel -->
      <div class="auth-panel active" id="signin-panel" role="tabpanel">
        <form id="form-signin" novalidate>

          <div class="auth-field">
            <label for="signin-email">Email</label>
            <input
              type="email"
              id="signin-email"
              name="email"
              placeholder="your@email.com"
              autocomplete="email"
              data-error-target="error-signin-email"
            />
            <p class="auth-error field-error" id="error-signin-email" style="display:none;"></p>
          </div>

          <div class="auth-field">
            <label for="signin-password">Password</label>
            <input
              type="password"
              id="signin-password"
              name="password"
              placeholder="Your password"
              autocomplete="current-password"
              data-error-target="error-signin-password"
            />
            <p class="auth-error field-error" id="error-signin-password" style="display:none;"></p>
          </div>

          <p class="auth-error general-error" id="error-signin-general" style="display:none;"></p>

          <button class="btn btn-primary btn-full auth-submit-btn" id="btn-signin" type="submit">
            <span class="auth-spinner" style="display:none;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                   style="animation:auth-spin 0.8s linear infinite;">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
            </span>
            <span class="auth-btn-label">Sign In</span>
          </button>

        </form>
      </div>

      <!-- Sign Up panel -->
      <div class="auth-panel" id="signup-panel" role="tabpanel">
        <form id="form-signup" novalidate>

          <div class="auth-field">
            <label for="signup-email">Email</label>
            <input
              type="email"
              id="signup-email"
              name="email"
              placeholder="your@email.com"
              autocomplete="email"
              data-error-target="error-signup-email"
            />
            <p class="auth-error field-error" id="error-signup-email" style="display:none;"></p>
          </div>

          <div class="auth-field">
            <label for="signup-password">Password</label>
            <input
              type="password"
              id="signup-password"
              name="password"
              placeholder="At least 6 characters"
              autocomplete="new-password"
              data-error-target="error-signup-password"
            />
            <p class="auth-error field-error" id="error-signup-password" style="display:none;"></p>
          </div>

          <div class="auth-field">
            <label for="signup-confirm">Confirm Password</label>
            <input
              type="password"
              id="signup-confirm"
              name="confirm"
              placeholder="Repeat your password"
              autocomplete="new-password"
              data-error-target="error-signup-confirm"
            />
            <p class="auth-error field-error" id="error-signup-confirm" style="display:none;"></p>
          </div>

          <p class="auth-error general-error" id="error-signup-general" style="display:none;"></p>

          <button class="btn btn-primary btn-full auth-submit-btn" id="btn-signup" type="submit">
            <span class="auth-spinner" style="display:none;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                   style="animation:auth-spin 0.8s linear infinite;">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
            </span>
            <span class="auth-btn-label">Create Account</span>
          </button>

        </form>
      </div>

      <!-- Footer note -->
      <p class="auth-footer-note">
        By continuing, you agree to iBloomi's
        <a href="terms.html">Terms of Use</a> and
        <a href="privacy-policy.html">Privacy Policy</a>.
      </p>

    </div>
  </main>

  <!-- Supabase JS client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Auth logic -->
  <script src="js/auth.js"></script>

</body>
</html>
